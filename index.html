
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            text-align: center;
            padding: 60px 20px;
            margin: 0;
        }

        .container {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 40px 20px;
            border-radius: 15px;
        }

        h1 {
            color: #2563eb;
        }

        p {
            color: #444;
            font-size: 18px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Welcome to My First Website!</h1>

        <p>Hello! I am learning web development.</p>

        <p>This website is built using HTML and CSS.</p>

        <button onclick="alert('Thank you for visiting my website!')">
            Click Me
        </button>
    </div>

</body>
</html>
